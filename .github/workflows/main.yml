```yaml
name: Build GeoView 0.2.7 ARM64

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install Git
        run: sudo apt-get update && sudo apt-get install -y git wget zstd build-essential

      - name: Download SDK
        run: wget -q "https://downloads.openwrt.org/releases/24.10.5/targets/mediatek/filogic/openwrt-sdk-24.10.5-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.zst" -O sdk.tar.zst

      - name: Extract SDK
        run: |
          mkdir sdk
          tar --use-compress-program=unzstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Get PassWall packages
        run: git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git sdk/package/passwall-packages

      - name: Build GeoView
        run: |
          cd sdk
          make defconfig
          make package/passwall-packages/geoview/compile V=s

      - name: Show IPK
        run: |
          find sdk/bin/packages -name "geoview*.ipk" -exec ls -lh {} \;

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: geoview-0.2.7-aarch64-cortex-a53
          path: sdk/bin/packages/aarch64_cortex-a53/**/*.ipk
```
